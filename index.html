<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Countdown</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #111, #000);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Fade-in animation */
.container {
    text-align: center;
    animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

h1 {
    font-size: 42px;
    margin-bottom: 30px;
    color: #00ffd5;
    text-shadow: 0 0 20px rgba(0,255,213,0.6);
}

.countdown {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
}

/* Glass effect cards */
.box {
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
    padding: 25px;
    width: 110px;
    transition: all 0.4s ease;
}

/* Smooth hover */
.box:hover {
    transform: translateY(-8px) scale(1.05);
    box-shadow: 0 0 25px rgba(0,255,213,0.4);
}

/* Number animation */
.number {
    font-size: 34px;
    font-weight: bold;
    color: #00ffd5;
    transition: all 0.3s ease;
}

.label {
    font-size: 14px;
    color: #aaa;
    margin-top: 6px;
}

/* Subtle glow pulse */
.number {
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {text-shadow: 0 0 5px #00ffd5;}
    to {text-shadow: 0 0 20px #00ffd5;}
}
</style>
</head>

<body>

<div class="container">
    <h1> Birthday Countdown</h1>

    <div class="countdown">
        <div class="box"><div id="months" class="number">0</div><div class="label">Months</div></div>
        <div class="box"><div id="weeks" class="number">0</div><div class="label">Weeks</div></div>
        <div class="box"><div id="days" class="number">0</div><div class="label">Days</div></div>
        <div class="box"><div id="hours" class="number">0</div><div class="label">Hours</div></div>
        <div class="box"><div id="minutes" class="number">0</div><div class="label">Minutes</div></div>
        <div class="box"><div id="seconds" class="number">0</div><div class="label">Seconds</div></div>
    </div>
</div>

<script>
// 👉 SET YOUR BIRTHDAY HERE
const birthday = new Date("2027-01-28");

function updateCountdown() {
    const now = new Date();
    let nextBirthday = new Date(
        now.getFullYear(),
        birthday.getMonth(),
        birthday.getDate()
    );

    if (now > nextBirthday) {
        nextBirthday.setFullYear(now.getFullYear() + 1);
    }

    const diff = nextBirthday - now;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / (1000 * 60)) % 60;
    const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const weeks = Math.floor(days / 7);
    const months = Math.floor(days / 30);

    setValue("months", months);
    setValue("weeks", weeks);
    setValue("days", days);
    setValue("hours", hours);
    setValue("minutes", minutes);
    setValue("seconds", seconds);
}

/* Smooth value change */
function setValue(id, value) {
    const el = document.getElementById(id);
    if (el.innerText != value) {
        el.style.transform = "scale(1.3)";
        setTimeout(() => {
            el.innerText = value;
            el.style.transform = "scale(1)";
        }, 150);
    }
}

setInterval(updateCountdown, 1000);
</script>

</body>
</html>
